name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm site

      # The committed artifacts must be what the tools read from the PDFs.
      - name: Install extraction tools
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils python3-pil
      - run: pnpm data:check
