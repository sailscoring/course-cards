name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "package.json version does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build the site (for the zip) and pack the library
        run: |
          pnpm site
          pnpm pack
          cp "site/${GITHUB_REF_NAME}/course-cards-${GITHUB_REF_NAME}.zip" .
          cp site/index.json catalogue.json

      # Publishes when the repository has an NPM_TOKEN secret: a granular
      # access token with publish rights on @sailscoring and 2FA bypass, which
      # npm limits to 90 days — see README.md, "Rotating NPM_TOKEN", and the
      # npm-token-expiry workflow that nags before it dies.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          if ! npm publish --provenance; then
            echo "::error title=npm publish failed::NPM_TOKEN was rejected — it has probably expired (npm caps write tokens at 90 days). Rotate it: README.md, 'Rotating NPM_TOKEN'. The GitHub Release is still created."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Not publishing to npm
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "::warning title=Not published to npm::No NPM_TOKEN secret, so this release is on GitHub only. To publish, set one — see README.md, 'Rotating NPM_TOKEN'."

      - uses: softprops/action-gh-release@v2
        if: ${{ always() }}
        with:
          files: |
            course-cards-${{ github.ref_name }}.zip
            catalogue.json
            sailscoring-course-cards-*.tgz
          generate_release_notes: true
