name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm trusted publishing (and its provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; whatever npm the Node
      # release happens to bundle is not a promise we can rely on.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "package.json version does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build the site (for the zip) and pack the library
        run: |
          pnpm site
          pnpm pack
          cp "site/${GITHUB_REF_NAME}/course-cards-${GITHUB_REF_NAME}.zip" .
          cp site/index.json catalogue.json

      # pnpm pack has just built dist/, so this checks what is about to be
      # published, not a stale build.
      - name: Check the built package resolves from CommonJS
        run: pnpm check:cjs

      # Published through npm's OIDC trusted publishing: no token, nothing to
      # rotate, and provenance is generated automatically. The trust lives on
      # npmjs.com — package settings name this repository and this file by
      # name — so renaming this workflow breaks publishing until it is updated
      # there.
      #
      # `stage publish`, not `publish`: the trusted publisher is configured
      # stage-only, so this uploads the tarball to the staging queue and stops.
      # Nothing is installable until a human approves it with 2FA, which no CI
      # job can do and none should be able to. See README.md, "Publishing to
      # npm" — the release is not finished when this workflow goes green.
      - name: Stage the npm publish
        run: |
          if ! npm stage publish; then
            echo "::error title=npm stage publish failed::Check the npm error above. An authentication error or an OTP prompt usually means the trusted publisher on npmjs.com does not match this workflow — organization, repository and the workflow filename are case-sensitive and must be exact. See README.md, 'Publishing to npm'."
            exit 1
          fi
          echo "::notice title=Staged, not published::The tarball is in npm's staging queue and is NOT installable yet. Approve it: 'npm stage list' then 'npm stage approve <id>', or from the package page on npmjs.com."

      - uses: softprops/action-gh-release@v3
        if: ${{ always() }}
        with:
          files: |
            course-cards-${{ github.ref_name }}.zip
            catalogue.json
            sailscoring-course-cards-*.tgz
          generate_release_notes: true
